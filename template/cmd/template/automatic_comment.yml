desc: 利用 DeepSeek 评论最新微博
steps:
- uses: get_index.yml
  env:
    uid: $env.uid
    cookie: $env.weibo
  output:
    mid: '{{ (env "blog").mid }}'
    name: '{{ (env "blog").user.screen_name }}'
    time: '{{ (env "blog").created_at }}'
    source: '{{ (env "blog").region_name }}'
    plaintext: '{{ (env "blog").text_raw }}'
  steps:
  - uses: deepseek_response.yml
    env:
      key: $env.key
      system: 接下来我会提供一条微博，请你帮我写一条评论，直接返回要评论的内容，不要用引号包裹内容，不要给出解释
      input: '博主“{{ env "name" }}”在“{{ env "time" }}”{{ env "source" }}说：“{{ env "plaintext" }}”'
    output:
      input: $env.input
      reply: $env.reply
    steps:
    - method: POST
      url: https://weibo.com/ajax/comments/create
      body: 'id={{ env "mid" }}&comment={{ env "reply" }}&is_repost=0'
      cookie: $env.weibo
      header:
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.212 Safari/537.36"
        Referer: "https://weibo.com/"
        X-Requested-With: "XMLHttpRequest"
        Content-Type: "application/x-www-form-urlencoded"
        X-Xsrf-Token: '{{ slice (env "weibo" | reg "XSRF-TOKEN=[^;]*") 11 }}'